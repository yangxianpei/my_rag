[project]
name = "myrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "charset-normalizer<4",
    "docx2txt>=0.9",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "jieba>=0.42.1",
    "langchain>=1.2.12",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-huggingface>=1.2.1",
    "langchain-milvus>=0.3.3",
    "langchain-openai>=1.1.11",
    "minio>=7.2.20",
    "pymysql>=1.1.2",
    "pypdf>=6.9.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.3.0",
    "sqlalchemy>=2.0.45",
    "urllib3<2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# 👈 把所有“重型”AI 库及其底层驱动全部锁死在 CPU 源
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
# 如果还有下载，把下面这些也加上（它们是主要的 NVIDIA 依赖来源）
nvidia-cudnn-cu12 = { index = "pytorch-cpu" }
nvidia-cublas-cu12 = { index = "pytorch-cpu" }