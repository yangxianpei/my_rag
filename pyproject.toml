[project]
name = "myrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "charset-normalizer<4",
    "docx2txt>=0.9",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "jieba>=0.42.1",
    "langchain>=1.2.12",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-huggingface>=1.2.1",
    "langchain-milvus>=0.3.3",
    "langchain-openai>=1.1.11",
    "minio>=7.2.20",
    "pymysql>=1.1.2",
    "pypdf>=6.9.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.3.0",
    "sqlalchemy>=2.0.45",
    "urllib3<2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # 👈 关键：这行表示“除非我指定，否则别去这个源找东西”

[tool.uv.sources]
# 👈 只有这两个大块头去专门的 CPU 源找，其他库一律走默认镜像
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }