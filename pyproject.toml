[project]
name = "myrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "charset-normalizer<4",
    "docx2txt>=0.9",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "jieba>=0.42.1",
    "langchain>=1.2.12",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-huggingface>=1.2.1",
    "langchain-milvus>=0.3.3",
    "langchain-openai>=1.1.11",
    "minio>=7.2.20",
    "pymysql>=1.1.2",
    "pypdf>=6.9.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.3.0",
    "sqlalchemy>=2.0.45",
    "urllib3<2",
]

[tool.uv]
# 重点：防止依赖冲突，确保解析最匹配的版本
index-strategy = "unsafe-best-match"

[tool.uv.sources]
# 强制 Linux 环境下所有 AI 核心库都去 CPU 源，绕过 NVIDIA 
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
# 增加这两行是解决 sentence-transformers 偷偷下载大包的关键
nvidia-cudnn-cu12 = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
nvidia-cublas-cu12 = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # 只有上面的 sources 指定时才去这个源