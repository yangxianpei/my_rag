[project]
name = "myrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "charset-normalizer<4",
    "docx2txt>=0.9",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "jieba>=0.42.1",
    "langchain>=1.2.12",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-huggingface>=1.2.1",
    "langchain-milvus>=0.3.3",
    "langchain-openai>=1.1.11",
    "minio>=7.2.20",
    "pymysql>=1.1.2",
    "pypdf>=6.9.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.3.0",
    "sqlalchemy>=2.0.45",
    "urllib3<2",
    # 补充 PyTorch 依赖（CPU 版本，适配 Windows）
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "cryptography>=46.0.5",
]

[tool.uv]
# 【关键修改】删除强制 Linux 环境的配置，让 uv 自动适配 Windows 系统
# 原行已删除：environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
# 保留 PyTorch CPU 源配置，确保 Windows 下载 CPU 版本
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # 仅 PyTorch 系列包使用该源，避免污染其他依赖
